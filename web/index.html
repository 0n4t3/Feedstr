<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <meta name="color-scheme" content="light dark">
    <!-- No scripts from other sites: the page may hold a Sync Key. (The inline
         script is trunk's loader; nothing a feed sends is ever put into the page.) -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self' https: wss: ws://localhost:* ws://127.0.0.1:*; img-src 'self' data:; frame-src nostr:; style-src 'self' 'unsafe-inline'">
    <title>Feedstr</title>
    <!-- wasm-opt shrinks the WebAssembly further; the features listed are the ones Rust's wasm target uses. -->
    <link data-trunk rel="rust" data-cargo-profile="web" data-wasm-opt="z"
          data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-multivalue --enable-reference-types">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1f; }
        @media (prefers-color-scheme: light) { html, body { background: #fbfbfc; } }
        canvas { display: block; width: 100%; height: 100%; outline: none; }
        noscript { color: #888; font: 16px sans-serif; display: block; padding: 2em; }
    </style>
</head>
<body>
    <canvas id="feedstr"></canvas>
    <noscript>Feedstr needs JavaScript and WebAssembly.</noscript>
</body>
</html>
