<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.title and page.title != site.title %}
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  {%- else %}
  <title>{{ site.title | escape }}</title>
  {%- endif %}
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" type="image/png" href="{{ "/logo.png" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/paper.css" | relative_url }}">
</head>
<body>
  {%- include header.html %}
  <main class="sheet">
    {{ content }}
  </main>
  {%- include footer.html %}
</body>
</html>
