[package]
name = "feedstr-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
# Each platform adds the eframe features it can use below.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "links"] }
# egui's own icon and emoji fonts, so symbols look the same on every platform.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
feed-rs = "3.0.0"
flate2 = "1.1.10"
futures = "0.3.34"
log = "0.4.34"
nostr-connect = "0.45.2"
nostr-sdk = "0.45.4"
quick-xml = "0.42"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "brotli"] }
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
eframe = "0.37.0"

# reqwest's usual certificate check needs extra Java setup on Android, so
# there feeds are checked against Mozilla's root certificates instead.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["system_fonts"] }
webpki-roots = "1.0.11"

# In the browser: its clock and timers, and its source of randomness.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", features = ["wasmbind"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
js-sys = "0.3"
nostr-browser-signer = "0.45.1"
uuid = { version = "1.29.0", features = ["js"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
nostr-sdk = { version = "0.45.4", features = ["local-relay"] }
